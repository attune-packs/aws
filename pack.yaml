ref: aws
label: "Amazon Web Services"
description: "Curated, guarded AWS infrastructure actions backed by current boto3 and Attune Key profiles"
version: "1.0.0"
author: "Attune; adapted from StackStorm, Inc. and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema:
  default_credential_key:
    type: string
    description: "Pack-owned Attune Key containing an AWS credential profile"
    default: "aws.credentials"

config:
  default_credential_key: "aws.credentials"

meta:
  category: integration
  documentation_url: "https://boto3.amazonaws.com/v1/documentation/api/1.43.72/reference/services/index.html"
  repository_url: "https://github.com/attune-packs/aws"
  source_repository: "https://github.com/StackStorm-Exchange/stackstorm-aws"
  source_version: "2.0.2"
  source_revision: "cc8ff4fa335229178ec24586aff4a69f9a270ecb"
  api_baseline: "boto3/botocore 1.43.72"
  license: "Apache-2.0"
  python_dependencies:
    - "attune-sdk>=0.1.0"
    - "boto3>=1.43.72,<2.0.0"

tags: [aws, amazon, cloud, infrastructure, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block

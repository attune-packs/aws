ref: aws.rds_start_instance
label: "Start RDS DB Instance"
description: "Start one RDS DB instance without automatic mutation retries"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  db_instance_identifier: {type: string, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, rds, database, mutation]

ref: aws.sts_get_caller_identity
label: "Get AWS Caller Identity"
description: "Return the account, ARN, and principal ID for the resolved profile"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string, description: "Region allowed by the credential profile"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, sts, identity, discovery]

ref: aws.s3_download_object
label: "Download S3 Object"
description: "Atomically download one bounded S3 object into the Attune artifact directory"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  bucket: {type: string, required: true}
  key: {type: string, required: true}
  artifact_path: {type: string, description: "Relative path below ATTUNE_ARTIFACTS_DIR", required: true}
  confirm: {type: string, description: "Required only for an existing file: OVERWRITE:<artifact_path>"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, s3, objects, artifact]

ref: aws.ec2_delete_tags
label: "Delete EC2 Instance Tags"
description: "Delete exact tags from EC2 instances after exact sorted-ID confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  instance_ids: {type: array, items: {type: string}, minItems: 1, maxItems: 100, required: true}
  tags: {type: object, required: true}
  confirm: {type: string, description: "DELETE-TAGS:<sorted comma-separated instance IDs>", required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, ec2, tags, destructive]

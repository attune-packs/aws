ref: aws.s3_head_object
label: "Head S3 Object"
description: "Read S3 object metadata without downloading its body"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  bucket: {type: string, required: true}
  key: {type: string, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, s3, objects, discovery]

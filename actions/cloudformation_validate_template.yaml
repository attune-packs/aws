ref: aws.cloudformation_validate_template
label: "Validate CloudFormation Template"
description: "Validate an inline CloudFormation template capped at the native 51,200-byte limit"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  template_body: {type: string, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, cloudformation, template, validation]

ref: aws.cloudformation_delete_stack
label: "Delete CloudFormation Stack"
description: "Delete one stack after exact stack-name confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  stack_name: {type: string, required: true}
  client_request_token: {type: string}
  confirm: {type: string, description: "DELETE:<stack_name>", required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, cloudformation, stacks, destructive]

ref: aws.cloudformation_wait_stack
label: "Wait For CloudFormation Stack"
description: "Run an allowlisted stack waiter with bounded delay and attempts"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  stack_name: {type: string, required: true}
  waiter: {type: string, enum: [stack_create_complete, stack_update_complete, stack_delete_complete, stack_rollback_complete], required: true}
  delay_seconds: {type: integer, default: 10, minimum: 1, maximum: 60}
  max_attempts: {type: integer, default: 60, minimum: 1, maximum: 120}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, cloudformation, stacks, polling]

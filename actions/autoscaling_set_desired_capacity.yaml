ref: aws.autoscaling_set_desired_capacity
label: "Set Auto Scaling Desired Capacity"
description: "Set desired capacity after exact group and capacity confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  group_name: {type: string, required: true}
  desired_capacity: {type: integer, minimum: 0, required: true}
  honor_cooldown: {type: boolean, default: true}
  confirm: {type: string, description: "SET:<group_name>:<desired_capacity>", required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, autoscaling, compute, destructive]

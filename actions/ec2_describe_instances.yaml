ref: aws.ec2_describe_instances
label: "Describe EC2 Instances"
description: "Describe EC2 instances with bounded SDK pagination"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  instance_ids: {type: array, items: {type: string}, maxItems: 100}
  filters: {type: array, items: {type: object}}
  max_results: {type: integer, default: 100, minimum: 1, maximum: 1000}
  page_size: {type: integer, default: 100, minimum: 5, maximum: 1000}
  starting_token: {type: string}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, ec2, instances, discovery]

ref: aws.s3_upload_object
label: "Upload S3 Object"
description: "Upload one confined Attune artifact using one PutObject attempt"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  bucket: {type: string, required: true}
  key: {type: string, required: true}
  artifact_path: {type: string, description: "Relative path below ATTUNE_ARTIFACTS_DIR", required: true}
  confirm: {type: string, description: "PUT:<bucket>/<key>", required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, s3, objects, artifact, mutation]

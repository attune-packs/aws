ref: aws.rds_stop_cluster
label: "Stop RDS DB Cluster"
description: "Stop one RDS DB cluster after exact identifier confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  db_cluster_identifier: {type: string, required: true}
  confirm: {type: string, description: "STOP:<db_cluster_identifier>", required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, rds, database, destructive]

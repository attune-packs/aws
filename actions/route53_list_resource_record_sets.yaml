ref: aws.route53_list_resource_record_sets
label: "List Route 53 Record Sets"
description: "List bounded record sets in one hosted zone"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  hosted_zone_id: {type: string, required: true}
  max_results: {type: integer, default: 100, minimum: 1, maximum: 10000}
  page_size: {type: integer, default: 100, minimum: 1, maximum: 300}
  starting_token: {type: string}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, route53, dns, discovery]

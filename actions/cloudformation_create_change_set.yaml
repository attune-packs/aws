ref: aws.cloudformation_create_change_set
label: "Create CloudFormation Change Set"
description: "Create a named change set from a bounded inline template"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: aws_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "aws.credentials", required: true}
  region: {type: string}
  stack_name: {type: string, required: true}
  change_set_name: {type: string, required: true}
  change_set_type: {type: string, enum: [CREATE, UPDATE], default: UPDATE}
  template_body: {type: string, required: true}
  parameters: {type: object}
  capabilities: {type: array, items: {type: string}}
  client_request_token: {type: string}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [aws, cloudformation, changeset, mutation]
